name: Update Morocco Market Data

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    # On ajoute un timeout pour ne pas gaspiller tes minutes si ça bloque
    timeout-minutes: 15 

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          # Le cache permet d'éviter de tout réinstaller à chaque fois
          cache: 'pip' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Run News Analysis (app.py)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python app.py

      - name: Run Market Update (bourse.py)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python bourse.py